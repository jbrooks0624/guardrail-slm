# Measurement contract. Change these only by committing a new contract, never
# to fit a result. Precision is meaningless without the prevalence it was
# measured at.
train:
  attack_prevalence: 0.50
test:
  attack_prevalence: 0.30
deployment:
  attack_prevalences: [0.05, 0.01]
selection:
  statistic: projected_precision
  at_prevalence: 0.01
  min_attack_recall: 0.90
latency:
  p95_added_ms: 100
operating_points:
  - id: high_recall
    description: Safety posture. Prefer catching attacks over avoiding false positives.
  - id: high_precision
    description: UX posture. Prefer avoiding false positives over catching every attack.
slices:
  - id: natural
    description: Human-authored attacks (deepset, jackhhao), Dolly easy benign, held-out wildjailbreak adversarial_benign. Headline numbers.
  - id: gpt_generated
    description: Held-out wildjailbreak adversarial_harmful. Frontier baselines have an unearned advantage here.
  - id: ood
    description: xTRam1/safe-guard-prompt-injection. Untouched by any training run.
ship_rule: The model that ships is the one meeting the latency budget with the best value of the selection statistic. If that is ModernBERT, ModernBERT ships.
